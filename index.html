<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sweat Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0A">
<title>Sweat Log</title>
  <link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;--surface:#141414;--surface2:#1C1C1C;--surface3:#242424;
  --border:rgba(255,255,255,0.065);--border2:rgba(255,255,255,0.13);
  --text:#F0ECE4;--text2:#A8A5A0;--muted:#524F4C;--muted2:#908C88;
  --accent:#F5C518;--accent-lo:rgba(245,197,24,0.08);--accent-mid:rgba(245,197,24,0.18);
  --green:#3DD68C;--red:#F55252;--blue:#5BA4F5;--purple:#c084fc;
  --fd:'Bebas Neue',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
  --nav-h:60px;--strip-h:76px;--r:12px;--r2:18px;
  --blur:blur(20px) saturate(180%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;}
input,textarea,button{font-family:inherit;cursor:pointer;border:none;background:none;}
textarea{resize:none;}
::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
@keyframes glowBeat{0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,0)}50%{box-shadow:0 0 24px 4px rgba(245,197,24,0.18)}}
@keyframes waveBar{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}
@keyframes savedFlash{0%{opacity:0;transform:scale(0.9)}20%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:var(--nav-h);background:rgba(10,10,10,0.95);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:300;padding-top:env(safe-area-inset-top);}
.logo{font-family:var(--fd);font-size:21px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 20px rgba(245,197,24,0.35);}
.nav-center{display:flex;gap:3px;}
.nav-tab{padding:6px 14px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:500;transition:all .2s;}
.nav-tab.active{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.nav-right{display:flex;align-items:center;gap:8px;}
.sync-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--border);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .4s;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 6px rgba(61,214,140,0.5);}
.sync-dot.err{background:var(--red);}
.sync-dot.spin{background:var(--accent);animation:blink 1s infinite;}
.sync-txt{font-family:var(--fm);font-size:10px;color:var(--muted);}
.split-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--muted2);font-family:var(--fm);font-size:10px;letter-spacing:.5px;transition:all .2s;}
.split-btn:hover{border-color:var(--border2);color:var(--text);}
.split-btn:active{transform:scale(0.95);}

/* FLOAT NAV */
.float-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:400;padding-bottom:env(safe-area-inset-bottom);pointer-events:none;}
.float-nav-inner{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(12,12,12,0.96);backdrop-filter:var(--blur);border:1px solid var(--border2);border-radius:99px;padding:7px 10px;box-shadow:0 8px 40px rgba(0,0,0,0.8);pointer-events:all;}
.fnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 14px;border-radius:99px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.5px;transition:all .2s;}
.fnav-btn.active{background:var(--accent-mid);color:var(--accent);}
.fnav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* STRIP */
.strip{display:flex;gap:7px;padding:10px 18px;overflow-x:auto;scrollbar-width:none;position:fixed;top:var(--nav-h);left:0;right:0;z-index:200;background:rgba(10,10,10,0.95);backdrop-filter:var(--blur);border-bottom:1px solid var(--border);height:var(--strip-h);align-items:center;}
.strip::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 11px;border-radius:12px;border:1px solid var(--border);background:var(--surface);transition:all .2s;min-width:54px;position:relative;}
.chip:active{transform:scale(0.93);}
.chip.active{border-color:var(--accent);background:var(--accent-lo);}
.chip.logged::after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(61,214,140,0.7);}
.chip-day{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
.chip-name{font-family:var(--fd);font-size:13px;letter-spacing:1px;}
.chip.active .chip-name{color:var(--accent);}
.chip-dot{width:5px;height:5px;border-radius:50%;}

/* LAYOUT */
.content{position:fixed;top:calc(var(--nav-h) + var(--strip-h));left:0;right:0;bottom:0;overflow:hidden;transition:top .3s;}
.split{display:grid;grid-template-columns:1fr 1fr;height:100%;}
.pane{overflow-y:auto;padding:16px 18px 60px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
.pane:first-child{border-right:1px solid var(--border);}

@media(max-width:680px){
  .split{grid-template-columns:1fr;}
  .pane{display:none;padding-bottom:100px;}
  .pane.active{display:block;}
  .pane:first-child{border-right:none;}
  .float-nav{display:flex;}
  .nav .nav-center{display:none;}
  #homeView,#historyView{padding:14px 14px 100px!important;}
}

/* HOME */
#homeView{height:100%;overflow-y:auto;padding:16px 18px 80px;-webkit-overflow-scrolling:touch;}
.home-hero{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;margin-top:6px;}
.home-name{font-family:var(--fd);font-size:28px;letter-spacing:2px;}
.home-greet{font-size:11px;color:var(--muted);margin-bottom:3px;}
.xp-pill{display:flex;align-items:center;gap:8px;background:var(--surface);padding:9px 12px;border-radius:var(--r2);border:1px solid var(--border);}
.xp-badge{width:34px;height:34px;border-radius:50%;background:var(--accent-mid);border:1px solid rgba(245,197,24,0.3);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:17px;color:var(--accent);}
.xp-info-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
.xp-info-val{font-family:var(--fm);font-size:10px;color:var(--accent);margin-top:1px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:12px;animation:fadeIn .3s ease;}
.card-title{font-family:var(--fd);font-size:12px;letter-spacing:2.5px;color:var(--muted);margin-bottom:10px;}
.today-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden;}
.today-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);}
.today-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
.today-day{font-family:var(--fd);font-size:26px;letter-spacing:2px;}
.today-sub{font-size:11px;color:var(--muted2);font-family:var(--fm);margin-top:2px;}
.today-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.day-badge{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:500;text-transform:uppercase;}
.start-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#000;padding:12px 20px;border-radius:12px;font-family:var(--fd);font-size:16px;letter-spacing:2px;box-shadow:0 0 20px rgba(245,197,24,0.25);width:100%;font-weight:700;transition:all .2s;}
.start-btn:active{transform:scale(0.97);}

.week-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.week-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 10px;text-align:center;}
.wc-icon{font-size:18px;margin-bottom:5px;}
.wc-val{font-family:var(--fd);font-size:24px;letter-spacing:1px;line-height:1;}
.wc-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}

/* CALISTHENICS PATTERN CARD */
.pattern-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:12px;}
.pattern-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.pattern-item{background:var(--surface2);border-radius:10px;padding:10px 12px;border:1px solid var(--border);}
.pi-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
.pi-val{font-family:var(--fd);font-size:19px;letter-spacing:1px;line-height:1.1;}
.pi-sub{font-family:var(--fm);font-size:9px;color:var(--muted2);margin-top:2px;}
.pattern-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:500;}
.pb-pull{background:rgba(91,164,245,0.12);color:var(--blue);border:1px solid rgba(91,164,245,0.2);}
.pb-push{background:rgba(245,82,82,0.1);color:var(--red);border:1px solid rgba(245,82,82,0.18);}
.pb-core{background:rgba(245,197,24,0.1);color:var(--accent);border:1px solid rgba(245,197,24,0.18);}
.pb-mobility{background:rgba(61,214,140,0.1);color:var(--green);border:1px solid rgba(61,214,140,0.18);}
.pb-legs{background:rgba(192,132,252,0.1);color:var(--purple);border:1px solid rgba(192,132,252,0.18);}
.pb-cardio{background:rgba(61,214,140,0.08);color:var(--green);border:1px solid rgba(61,214,140,0.15);}

.calli-totals{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.ct-pill{display:flex;align-items:center;gap:5px;background:var(--surface3);border-radius:8px;padding:6px 10px;border:1px solid var(--border);}
.ct-icon{font-size:12px;}
.ct-val{font-family:var(--fd);font-size:15px;color:var(--text);}
.ct-lbl{font-family:var(--fm);font-size:9px;color:var(--muted);}

.next-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.next-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.next-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;}
.next-name{font-family:var(--fd);font-size:18px;letter-spacing:1px;}
.next-sub{font-size:10px;color:var(--muted2);font-family:var(--fm);margin-top:1px;}

/* OVERVIEW TABLE */
.overview-table{width:100%;border-collapse:collapse;font-size:12px;}
.overview-table th{text-align:left;padding:6px 8px;font-family:var(--fm);font-size:9px;color:var(--muted);letter-spacing:.6px;font-weight:400;border-bottom:1px solid var(--border);}
.overview-table td{padding:8px;border-bottom:1px solid var(--border);}
.overview-table tr:last-child td{border-bottom:none;}
.overview-row-active td:first-child{color:var(--accent);font-family:var(--fd);font-size:14px;}
.overview-row-active{background:var(--accent-lo);}

/* HEATMAP */
.heatmap-grid{display:flex;gap:3px;flex-wrap:wrap;}
.hm-cell{width:11px;height:11px;border-radius:2px;background:var(--surface3);}
.hm-cell.l1{background:rgba(245,197,24,0.2);}
.hm-cell.l2{background:rgba(245,197,24,0.5);}
.hm-cell.l4{background:var(--accent);box-shadow:0 0 3px rgba(245,197,24,0.4);}
.heatmap-legend{display:flex;align-items:center;gap:4px;margin-top:8px;justify-content:flex-end;}
.hm-leg{font-size:9px;color:var(--muted);}

/* RECORDS */
.record-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.record-row:last-child{border-bottom:none;}
.record-name{font-size:12px;color:var(--text2);}
.record-val{font-family:var(--fd);font-size:17px;color:var(--accent);}
.record-date{font-family:var(--fm);font-size:9px;color:var(--muted);margin-top:1px;}

/* WORKOUT */
.prog-header{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:12px;}
.prog-stat{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px;border-right:1px solid var(--border);}
.prog-stat:first-child{padding-left:0;}
.prog-stat:last-child{border-right:none;}
.prog-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;}
.prog-val{font-family:var(--fd);font-size:20px;letter-spacing:1px;line-height:1.1;}
.day-title{font-family:var(--fd);font-size:34px;letter-spacing:2px;line-height:1;}
.day-meta{display:flex;align-items:center;gap:8px;margin-top:5px;margin-bottom:10px;}
.badge{padding:3px 9px;border-radius:99px;font-size:10px;font-weight:500;text-transform:uppercase;}
.day-obj{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6;padding:9px 12px;background:var(--surface);border-radius:9px;border:1px solid var(--border);border-left:2px solid var(--accent);}
.phases{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.phase-btn{padding:5px 11px;border-radius:8px;border:1px solid var(--border);color:var(--muted);font-family:var(--fm);font-size:11px;transition:all .18s;}
.phase-btn.active{background:var(--surface2);color:var(--text);border-color:var(--border2);}
.sec-title{font-family:var(--fd);font-size:11px;letter-spacing:2.5px;color:var(--muted);margin-bottom:7px;margin-top:12px;}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;display:flex;align-items:flex-start;gap:8px;}
.ex-left{flex:1;min-width:0;}
.ex-name{font-weight:500;font-size:13px;margin-bottom:2px;}
.ex-note{font-size:11px;color:var(--muted2);line-height:1.5;}
.ex-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.ex-vol{font-family:var(--fm);font-size:11px;color:var(--accent);background:var(--accent-lo);padding:4px 8px;border-radius:6px;border:1px solid rgba(245,197,24,0.1);}
.ex-prev{font-family:var(--fm);font-size:9px;color:var(--muted);}
.circuit-wrap{background:var(--surface);border:1px solid rgba(245,82,82,0.18);border-radius:var(--r2);padding:14px;margin-bottom:10px;}
.circuit-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.circuit-lbl{font-family:var(--fd);font-size:14px;letter-spacing:1px;color:var(--red);}
.circuit-sub{font-size:10px;color:var(--muted);}
.circuit-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.circuit-row:last-child{border-bottom:none;}
.c-letter{font-family:var(--fd);font-size:17px;color:var(--red);width:20px;flex-shrink:0;}
.c-name{font-size:13px;font-weight:500;flex:1;padding:0 9px;}
.c-prev-small{font-family:var(--fm);font-size:9px;color:var(--muted);display:block;margin-top:1px;}
.c-reps{font-family:var(--fm);font-size:11px;color:var(--accent);}
.tip{background:var(--accent-lo);border:1px solid rgba(245,197,24,0.1);border-radius:var(--r);padding:10px 13px;margin-top:10px;font-size:12px;color:#c8a93a;line-height:1.6;}

/* TIMER */
.timer-widget{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);padding:18px 16px;margin-top:14px;text-align:center;}
.timer-tabs{display:flex;gap:5px;margin-bottom:14px;}
.timer-tab{flex:1;padding:6px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--fm);font-size:11px;transition:all .18s;}
.timer-tab.active{background:var(--surface2);color:var(--text);border-color:var(--border2);}
.timer-circle-wrap{position:relative;width:140px;height:140px;margin:0 auto 14px;}
.timer-circle-svg{width:140px;height:140px;transform:rotate(-90deg);}
.timer-circle-bg{fill:none;stroke:var(--border2);stroke-width:4;}
.timer-circle-prog{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-dasharray:376;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .3s;}
.timer-circle-prog.warning{stroke:var(--accent);}
.timer-circle-prog.done{stroke:var(--red);}
.timer-display-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.timer-display{font-family:var(--fd);font-size:46px;letter-spacing:3px;color:var(--text);transition:color .3s;line-height:1;}
.timer-display.running{color:var(--green);}
.timer-display.warning{color:var(--accent);animation:timerPulse .5s infinite;}
.timer-display.done{color:var(--red);}
.timer-presets{display:flex;gap:5px;margin-bottom:12px;justify-content:center;flex-wrap:wrap;}
.preset-btn{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--fm);font-size:11px;transition:all .15s;}
.preset-btn:active{background:var(--accent-lo);color:var(--accent);}
.timer-controls{display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:10px;}
.t-btn{width:46px;height:46px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .18s;border:1px solid var(--border2);background:transparent;color:var(--text);}
.t-btn:active{transform:scale(0.91);}
.t-btn.start{width:64px;height:64px;font-size:24px;background:var(--green);color:#000;border:none;box-shadow:0 0 18px rgba(61,214,140,0.2);}
.t-btn.start.pause{background:var(--accent);box-shadow:0 0 18px rgba(245,197,24,0.2);}
.focus-mode{display:none;position:fixed;inset:0;z-index:9000;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.focus-mode.active{display:flex;}
.focus-exit{position:fixed;top:20px;right:20px;color:var(--muted2);font-family:var(--fm);border:1px solid var(--border);padding:7px 14px;border-radius:99px;background:var(--surface);font-size:11px;}
.focus-circle-wrap{position:relative;width:min(68vw,260px);height:min(68vw,260px);}
.focus-circle-svg{width:100%;height:100%;transform:rotate(-90deg);}
.focus-circle-bg{fill:none;stroke:var(--border2);stroke-width:5;}
.focus-circle-prog{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-dasharray:750;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .3s;}
.focus-circle-prog.warning{stroke:var(--accent);}
.focus-circle-prog.done{stroke:var(--red);}
.focus-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.focus-lbl{font-family:var(--fm);font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
.focus-display{font-family:var(--fd);font-size:clamp(52px,14vw,82px);letter-spacing:4px;color:var(--text);line-height:1;transition:color .3s;}
.focus-display.running{color:var(--green);}
.focus-display.warning{color:var(--accent);animation:timerPulse .5s infinite;}
.focus-display.done{color:var(--red);}
.focus-presets{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:360px;}
.focus-preset{padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--fm);font-size:12px;}

// ── CALISTHENICS STATS ENGINE ─────────────────────────────────────────────────
// Parse logged value string → {reps, holdSec}
// Supports: "6x3", "5x5", "12-15", "10", "3x30s", "3x45s/cote", "2 min", "45 min", "1 min"
function parseCalliValue(val) {
  if (!val) return {reps:0, holdSec:0};
  val = String(val).trim().toLowerCase();
  var reps = 0, holdSec = 0;

  // "NxMs" → sets x hold seconds (e.g. "3x30s", "4x45s")
  var m = val.match(/^(\d+)\s*x\s*(\d+)\s*s/);
  if (m) { holdSec = parseInt(m[1]) * parseInt(m[2]); return {reps, holdSec}; }

  // "NxM" → sets x reps (e.g. "6x3", "5x5")
  m = val.match(/^(\d+)\s*x\s*(\d+)/);
  if (m) { reps = parseInt(m[1]) * parseInt(m[2]); return {reps, holdSec}; }

  // "N min" → minutes to seconds
  m = val.match(/^(\d+(?:\.\d+)?)\s*min/);
  if (m) { holdSec = Math.round(parseFloat(m[1]) * 60); return {reps, holdSec}; }

  // "Xs" or "X s" plain hold
  m = val.match(/^(\d+)\s*s\b/);
  if (m) { holdSec = parseInt(m[1]); return {reps, holdSec}; }

  // "N-M" range → take lower
  m = val.match(/^(\d+)\s*-\s*\d+/);
  if (m) { reps = parseInt(m[1]); return {reps, holdSec}; }

  // plain number
  m = val.match(/^(\d+)/);
  if (m) { reps = parseInt(m[1]); return {reps, holdSec}; }

  return {reps:0, holdSec:0};
}

function computeCalliStats(entryData, di) {
  // entryData = J[k], returns {totalReps, holdSec, byPattern}
  var byPattern = {PULL:0, PUSH:0, CORE:0, MOBILITY:0, LEGS:0, CARDIO:0};
  var byPatternHold = {PULL:0, PUSH:0, CORE:0, MOBILITY:0};
  var totalReps = 0, totalHold = 0;
  if (!entryData || !entryData.perfs) return {totalReps, totalHold, byPattern, byPatternHold};

  var overrides = getCustomPatterns(di);
  Object.keys(entryData.perfs).forEach(function(exName) {
    var pf = entryData.perfs[exName];
    if (!pf || !pf.value) return;
    var parsed = parseCalliValue(pf.value);
    var pattern = getPattern(exName, overrides);
    totalReps += parsed.reps;
    totalHold += parsed.holdSec;
    if (parsed.reps && byPattern[pattern] !== undefined) byPattern[pattern] += parsed.reps;
    if (parsed.holdSec && byPatternHold[pattern] !== undefined) byPatternHold[pattern] += parsed.holdSec;
  });
  return {totalReps, totalHold, byPattern, byPatternHold};
}

function getCustomPatterns(di) {
  // returns map of exName -> pattern for this day's exercises from custom split
  var split = getActiveSplit();
  if (!split || !split[di] || !split[di].sections) return {};
  var map = {};
  split[di].sections.forEach(function(sec) {
    (sec.exercises || []).forEach(function(ex) {
      if (ex.pattern) map[ex.name] = ex.pattern;
    });
  });
  if (split[di].circuit) {
    split[di].circuit.forEach(function(ex) {
      if (ex.pattern) map[ex.name] = ex.pattern;
    });
  }
  return map;
}

function fmtHold(sec) {
  if (!sec) return '0s';
  if (sec < 60) return sec + 's';
  return Math.floor(sec/60) + 'm ' + (sec%60 ? (sec%60)+'s' : '');
}

function computeWeekCalliStats() {
  var now = new Date();
  var monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  monday.setHours(0,0,0,0);
  var totalReps = 0, totalHold = 0;
  var byPattern = {PULL:0, PUSH:0, CORE:0, MOBILITY:0, LEGS:0, CARDIO:0};
  Object.keys(J).forEach(function(k) {
    if (k === '__phase__' || k === '__split__') return;
    var ds = k.split('_').slice(1).join('_');
    var d = new Date(ds + 'T12:00:00');
    if (d < monday || d > now) return;
    var di = parseInt(k.split('_')[0].replace('d',''));
    var stats = computeCalliStats(J[k], di);
    totalReps += stats.totalReps;
    totalHold += stats.totalHold;
    Object.keys(byPattern).forEach(function(p) { byPattern[p] += (stats.byPattern[p]||0); });
  });
  return {totalReps, totalHold, byPattern};
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function computeScore(e) {
  if (!e) return null;
  var s = 50;
  if (e.rpe) { var r = +e.rpe; s += (r>=6&&r<=9)?15:(r>=4?8:0); }
  if (e.duration) { var d = +e.duration; s += d>=30?10:0; s += d>=50?5:0; }
  if (e.state) { var st = e.state; s += Math.round(((((st.energy||5)+(st.motivation||5)+(st.sleep||5))/3)-5)*2); }
  if (e.perfs) s += Math.min(Object.values(e.perfs).filter(function(p){return p&&p.value;}).length * 4, 20);
  if (e.notes && e.notes.length > 5) s += 5;
  return Math.max(10, Math.min(99, s));
}

function getBadges(e, score) {
  var b = [];
  if (score >= 88) b.push({type:'record', label:'RECORD'});
  if (e.rpe && +e.rpe >= 9) b.push({type:'hard', label:'HARD SESSION'});
  if (score >= 70 && score < 88) b.push({type:'consistent', label:'CONSISTANT'});
  return b.slice(0,3);
}

function computeStreak() {
  var logged = {};
  Object.keys(J).forEach(function(k) {
    if (k !== '__phase__' && k !== '__split__') logged[k.split('_').slice(1).join('_')] = true;
  });
  var streak = 0;
  var d = todayStr();
  if (!logged[d]) d = shiftDate(d, -1);
  for (var i = 0; i < 365; i++) {
    if (logged[d]) { streak++; d = shiftDate(d, -1); }
    else break;
  }
  return streak;
}

function weekSessions() {
  var now = new Date();
  var monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  monday.setHours(0,0,0,0);
  var c = 0;
  Object.keys(J).forEach(function(k) {
    if (k === '__phase__' || k === '__split__') return;
    var d = new Date(k.split('_').slice(1).join('_') + 'T12:00:00');
    if (d >= monday && d <= now) c++;
  });
  return c;
}

function totalSessions() {
  return Object.keys(J).filter(function(k) { return k !== '__phase__' && k !== '__split__'; }).length;
}

function computeXP() {
  var xp = totalSessions() * 120 + computeStreak() * 30;
  Object.values(J).forEach(function(e) {
    if (!e || typeof e !== 'object') return;
    if (e.perfs) xp += Object.values(e.perfs).filter(function(p){return p&&p.value;}).length * 20;
    if (e.score && e.score >= 88) xp += 80;
  });
  return xp;
}

function xpLevel(xp) {
  var thresholds = [0,300,700,1300,2200,3500,5200,7500,10500,14500,20000];
  var level = 1;
  for (var i = 1; i < thresholds.length; i++) { if (xp >= thresholds[i]) level = i+1; else break; }
  var cur = thresholds[Math.min(level-1, thresholds.length-1)];
  var next = thresholds[Math.min(level, thresholds.length-1)];
  var pct = next > cur ? Math.round((xp-cur)/(next-cur)*100) : 100;
  return {level:level, xp:xp, pct:pct, xpToNext:Math.max(0,next-xp)};
}

function buildHeatmap() {
  var h = '';
  for (var i = 83; i >= 0; i--) {
    var d = shiftDate(todayStr(), -i);
    var count = Object.keys(J).filter(function(k) { return k !== '__phase__' && k !== '__split__' && k.indexOf('_'+d) > 0; }).length;
    var cls = count >= 3 ? 'l4' : count === 2 ? 'l2' : count === 1 ? 'l1' : '';
    h += '<div class="hm-cell ' + cls + '" title="' + d + '"></div>';
  }
  return h;
}

function getRecords() {
  var recs = {
    'Tractions': {val:null, date:null},
    'Support Hold': {val:null, date:null},
    'Dead Hang': {val:null, date:null},
    'Pompes Anneaux': {val:null, date:null},
    'Rowing Anneaux': {val:null, date:null}
  };
  Object.keys(J).sort().reverse().forEach(function(k) {
    if (k === '__phase__' || k === '__split__') return;
    var ds = k.split('_').slice(1).join('_');
    var e = J[k];
    if (!e || !e.perfs) return;
    Object.keys(e.perfs).forEach(function(name) {
      var p = e.perfs[name];
      if (!p || !p.value) return;
      if (name.indexOf('Tractions') >= 0 && !recs['Tractions'].val) recs['Tractions'] = {val:p.value, date:ds};
      if (name.indexOf('Support Hold') >= 0 && !recs['Support Hold'].val) recs['Support Hold'] = {val:p.value, date:ds};
      if (name.indexOf('Dead Hang') >= 0 && !recs['Dead Hang'].val) recs['Dead Hang'] = {val:p.value, date:ds};
      if (name.indexOf('Pompes Anneaux') >= 0 && !recs['Pompes Anneaux'].val) recs['Pompes Anneaux'] = {val:p.value, date:ds};
      if (name.indexOf('Rowing Anneaux') >= 0 && !recs['Rowing Anneaux'].val) recs['Rowing Anneaux'] = {val:p.value, date:ds};
    });
  });
  return recs;
}

function logWeight() {
  var inp = document.getElementById('weightInput');
  if (!inp || !inp.value || isNaN(+inp.value)) return;
  var weights = getWeights();
  var entry = {date: todayStr(), val: parseFloat(inp.value)};

  if (idx >= 0) weights[idx] = entry; else weights.push(entry);
  weights.sort(function(a,b) { return a.date.localeCompare(b.date); });
  try { localStorage.setItem('sweatlog_weights', JSON.stringify(weights.slice(-52))); } catch(e) {}
  renderHome();
}

function getPrevPerf(di, exName) {
  var keys = Object.keys(J).filter(function(k) { return k.indexOf('d'+di+'_') === 0; }).sort().reverse();

    var k = keys[i];

  }
  return null;
}

// ── TIMER ─────────────────────────────────────────────────────────────────────
function buildTimerHTML() {
  var r = 60, circ = (2 * Math.PI * r).toFixed(1);
  return '<div class="timer-widget" id="timerWidget">' +
    '<div class="timer-tabs">' +
    '<button class="timer-tab ' + (timerMode==='rest'?'active':'') + '" onclick="switchTimer(\'rest\')">⏱ Repos</button>' +
    '<button class="timer-tab ' + (timerMode==='stopwatch'?'active':'') + '" onclick="switchTimer(\'stopwatch\')">⏲ Chrono</button>' +
    '</div>' +
    '<div class="timer-circle-wrap">' +
    '<svg class="timer-circle-svg" viewBox="0 0 140 140"><circle class="timer-circle-bg" cx="70" cy="70" r="' + r + '"/><circle class="timer-circle-prog" id="timerCircle" cx="70" cy="70" r="' + r + '" stroke-dasharray="' + circ + '" stroke-dashoffset="0"/></svg>' +
    '<div class="timer-display-inner"><div class="timer-display" id="timerDisplay">00:00</div></div>' +
    '</div>' +
    (timerMode==='rest' ? '<div class="timer-presets">' +
    ['25s','30s','1:00','1:30','2:00','2:30','3:00','4:00','5:00'].map(function(l,i) {
      var secs = [25,30,60,90,120,150,180,240,300][i];
      return '<button class="preset-btn" onclick="setRest(' + secs + ')">' + l + '</button>';
    }).join('') + '</div>' : '') +
    '<div class="timer-controls">' +
    '<button class="t-btn" onclick="stopTimer()">■</button>' +
    '<button class="t-btn start ' + (timerRunning?'pause':'') + '" id="startPauseBtn" onclick="toggleTimer()">' + (timerRunning?'⏸':'▶') + '</button>' +
    '<button class="t-btn" onclick="resetTimer()">↺</button>' +
    '</div>' +
    '<div style="text-align:center;margin-top:6px;">' +
    '<button onclick="openFocus()" style="font-family:var(--fm);font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);padding:6px 12px;border-radius:7px;">⊞ MODE FOCUS</button>' +
    '</div></div>';
}

function updateCircle(pct, cls) {
  var r = 60, circ = 2 * Math.PI * r;
  var offset = circ * (1 - pct/100);
  var el = document.getElementById('timerCircle');
  if (el) { el.style.strokeDashoffset = offset; el.className = 'timer-circle-prog' + (cls?' '+cls:''); }
  var r2 = 72, circ2 = 2 * Math.PI * r2;
  var fc = document.getElementById('focusCircle');
  if (fc) { fc.style.strokeDashoffset = circ2*(1-pct/100); fc.className = 'focus-circle-prog' + (cls?' '+cls:''); }
}

function getTimerState() {
  if (timerMode === 'rest') {
    var s = timerRunning ? Math.max(0, timerSeconds - (Date.now()-timerStart)/1000) : timerSeconds;
    var cls = s===0 ? 'done' : (s<10&&timerRunning) ? 'warning' : timerRunning ? 'running' : '';
    var pct = timerTotalSeconds > 0 ? Math.round(s/timerTotalSeconds*100) : 0;
    return {txt: pad2(Math.floor(s/60))+':'+pad2(Math.floor(s%60)), cls:cls, pct:pct};
  } else {
    var ms = timerRunning ? Date.now()-swBase : swElapsed;
    var s2 = ms/1000;
    return {txt: pad2(Math.floor(s2/60))+':'+pad2(Math.floor(s2%60))+'.'+Math.floor((s2%1)*10), cls:timerRunning?'running':'', pct:100};
  }
}

function pad2(n) { return String(Math.floor(n)).padStart(2,'0'); }

function updateTimerDisplay() {
  var st = getTimerState();
  var d1 = document.getElementById('timerDisplay');
  var d2 = document.getElementById('focusDisplay');
  if (d1) { d1.textContent = st.txt; d1.className = 'timer-display' + (st.cls?' '+st.cls:''); }
  if (d2) { d2.textContent = st.txt; d2.className = 'focus-display' + (st.cls?' '+st.cls:''); }
  updateCircle(st.pct, st.cls);
}

function updateTimerBtns() {
  ['startPauseBtn','focusStartBtn'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b) { b.textContent = timerRunning?'⏸':'▶'; b.className = (id==='startPauseBtn'?'t-btn start':'f-btn start') + (timerRunning?' pause':''); }
  });
}

function switchTimer(mode) {
  stopTimer(); timerMode = mode;
  if (mode==='rest') { timerSeconds=150; timerTotalSeconds=150; }
  else { swElapsed=0; swBase=0; }
  var w = document.getElementById('timerWidget');
  if (w) { var tmp=document.createElement('div'); tmp.innerHTML=buildTimerHTML(); w.replaceWith(tmp.firstChild); }
  updateTimerDisplay();
}

function setRest(s) { if (timerRunning) stopTimer(); timerSeconds=s; timerTotalSeconds=s; updateTimerDisplay(); }

function toggleTimer() { timerRunning ? pauseTimer() : startTimer(); }

function startTimer() {
  timerRunning = true;
  if (timerMode==='rest') { timerStart=Date.now(); timerInterval=setInterval(tickRest,200); }
  else { swBase=Date.now()-swElapsed; timerInterval=setInterval(function(){swElapsed=Date.now()-swBase;updateTimerDisplay();},80); }
  updateTimerDisplay(); updateTimerBtns();
}

function pauseTimer() {
  timerRunning=false; clearInterval(timerInterval);
  if (timerMode==='stopwatch') swElapsed=Date.now()-swBase;
  updateTimerBtns();
}

function stopTimer() {
  timerRunning=false; clearInterval(timerInterval);
  if (timerMode==='rest') timerSeconds=timerTotalSeconds; else { swElapsed=0; swBase=0; }
  updateTimerDisplay(); updateTimerBtns();
}

function resetTimer() {
  pauseTimer();
  if (timerMode==='rest') { timerSeconds=timerTotalSeconds; }
  else { swElapsed=0; swBase=0; }
  updateTimerDisplay();
}

function tickRest() {
  var rem = timerSeconds - (Date.now()-timerStart)/1000;
  if (rem <= 0) { clearInterval(timerInterval); timerRunning=false; vibrate(); playBeep(); updateTimerDisplay(0); updateTimerBtns(); return; }
  updateTimerDisplay();
}

function openFocus() {
  document.getElementById('focusMode').classList.add('active');
  var lbl = document.getElementById('focusLbl'); if (lbl) lbl.textContent = timerMode==='rest'?'REPOS':'CHRONO';
  var fp = document.getElementById('focusPresets'); if (fp) fp.style.display = timerMode==='rest'?'flex':'none';
  updateTimerDisplay(); updateTimerBtns();
}
function exitFocus() { document.getElementById('focusMode').classList.remove('active'); }
function vibrate() { try { if (navigator.vibrate) navigator.vibrate([300,100,300,100,300]); } catch(e){} }
function playBeep() {
  try {
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6].forEach(function(t) {
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880;
      g.gain.setValueAtTime(.3, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.2);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2);
    });
  } catch(e){}
}

// ── JOURNAL ───────────────────────────────────────────────────────────────────
function updateSliderGrad(el) {
  if (!el) return;
  var v = (el.value - el.min) / (el.max - el.min) * 100;
  el.style.background = 'linear-gradient(to right, var(--accent) ' + v + '%, var(--border2) ' + v + '%)';
}

function renderJournal() {
  var days = DAYS();
  var ds = dayDates[cDay], k = jk(cDay, ds);
  var e = J[k] || {}, isTdy = ds === todayStr();
  var state = e.state || {energy:7, motivation:7, sleep:7};
  var d = days[cDay];
  if (!d) return;
  var perfs = e.perfs || {};

  var exList = [];
  if (d.type === 'circuit') {
    exList = (d.circuit||[]).map(function(x) { return {name: x.name, pattern: x.pattern}; });
  } else {
    (d.sections||[]).forEach(function(s) {
      (s.exercises||[]).forEach(function(x) { exList.push({name:x.name, pattern:x.pattern}); });
    });
  }

  // Compute current session calli stats if any perfs logged
  var calliSession = computeCalliStats(e, cDay);
  var hasPerfs = Object.keys(perfs).some(function(k) { return perfs[k] && perfs[k].value; });

  var exCards = exList.map(function(ex) {
    var p = perfs[ex.name] || {}, prev = getPrevPerf(cDay, ex.name);
    var safeEx = ex.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var pc = PATTERN_COLORS[ex.pattern || 'PUSH'];
    return '<div class="jex-card">' +
      '<div class="jex-top">' +
      '<span class="jex-name">' + ex.name + '</span>' +
      '<span class="pattern-badge ' + pc.cls + '">' + pc.label + '</span>' +
      '</div>' +
      '<div class="jex-row">' +
      '<input class="jex-input" placeholder="sets x reps · ex: 5x5, 3x30s, 2 min..." value="' + sv(p.value||'') + '" oninput="setPerfVal(\'' + safeEx + '\',this.value)">' +
      (prev ? '<span class="jex-prev">' + prev.value + '</span>' : '') +
      '</div>' +
      '<textarea class="jex-note" placeholder="Note..." oninput="setPerfNote(\'' + safeEx + '\',this.value)" rows="1">' + (p.note||'') + '</textarea>' +
      '</div>';
  }).join('');

  var pastKeys = Object.keys(J).filter(function(x) { return x.indexOf('d'+cDay+'_')===0 && x!==k && x!=='__phase__' && x!=='__split__'; }).sort().reverse().slice(0,5);

  var pastHTML = pastKeys.length ? pastKeys.map(function(pk) {
    var pe = J[pk], pd = pk.split('_').slice(1).join('_');
    var sc = pe.score || computeScore(pe);
    var ps = computeCalliStats(pe, cDay);
    return '<div class="ecard">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
      '<div class="edate">' + fmtDate(pd) + '</div>' +
      (sc?'<span style="font-family:var(--fd);font-size:15px;color:var(--accent)">'+sc+'</span>':'') +
      '</div>' +
      (pe.notes?'<div class="equick">'+pe.notes+'</div>':'') +
      (pe.text?'<div class="ebody">'+pe.text+'</div>':'') +
      '<div class="echips">' +
      (pe.rpe?'<span class="echip gold">RPE '+pe.rpe+'/10</span>':'') +
      (pe.duration?'<span class="echip">'+pe.duration+' min</span>':'') +
      (ps.totalReps?'<span class="echip">🔢 '+ps.totalReps+' reps</span>':'') +
      (ps.totalHold?'<span class="echip">⏱ '+fmtHold(ps.totalHold)+'</span>':'') +
      '</div></div>';
  }).join('') : '<div class="empty-state">Aucune entree pour ce jour.<br>Log ta seance ici.</div>';

  document.getElementById('journalPane').innerHTML =
    '<div class="j-header"><div class="j-title">JOURNAL</div><button class="save-btn" id="saveBtn" onclick="saveEntry()">Sauvegarder</button></div>' +
    '<div class="date-row">' +
    '<button class="date-btn" onclick="chDate(-1)">&#8249;</button>' +
    '<div class="date-display">' + fmtDate(ds) + '</div>' +
    '<button class="date-btn" onclick="chDate(1)" ' + (isTdy?'disabled':'') + '>&#8250;</button>' +
    (!isTdy?'<button class="today-lnk" onclick="goToday()">Auj.</button>':'') +
    '</div>' +
    '<div class="j-bloc-title">ETAT DU JOUR</div>' +
    '<div class="state-grid">' +
    [{key:'energy',lbl:'Energie',val:state.energy},{key:'motivation',lbl:'Motivation',val:state.motivation},{key:'sleep',lbl:'Sommeil',val:state.sleep||7}].map(function(s) {
      return '<div class="state-box"><div class="state-label">' + s.lbl + '</div>' +
        '<div class="state-row">' +
        '<input type="range" class="state-slider" min="0" max="10" value="' + s.val + '" oninput="patchState(\'' + s.key + '\',+this.value);this.nextElementSibling.textContent=this.value;updateSliderGrad(this)">' +
        '<div class="state-val">' + s.val + '</div>' +
        '</div></div>';
    }).join('') +
    '</div>' +
    '<div class="perf-grid">' +
    '<div class="perf-box"><div class="mlabel">RPE (1-10)</div><input class="minput" type="number" min="1" max="10" placeholder="—" value="' + sv(e.rpe) + '" oninput="patch(\'rpe\',this.value)"></div>' +
    '<div class="perf-box"><div class="mlabel">Duree (min)</div><input class="minput" type="number" placeholder="—" value="' + sv(e.duration) + '" oninput="patch(\'duration\',this.value)"></div>' +
    '</div>' +
    // Live calli stats if perfs exist
    (hasPerfs ? '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;padding:10px 12px;background:var(--surface);border-radius:9px;border:1px solid var(--border);">' +

      Object.keys(calliSession.byPattern).filter(function(p){return calliSession.byPattern[p]>0;}).map(function(p) {
        var pc = PATTERN_COLORS[p];
        return '<div class="ct-pill"><span class="ct-val" style="color:'+pc.hex+'">'+calliSession.byPattern[p]+'</span><span class="ct-lbl">'+pc.label+'</span></div>';
      }).join('') +
    '</div>' : '') +
    '<div class="j-bloc-title">EXERCICES</div>' + exCards +
    '<div class="j-bloc-title">RESSENTI</div>' +
    '<div class="field"><input class="finput" placeholder="Notes rapides — PRs, charges..." value="' + sv(e.notes) + '" oninput="patch(\'notes\',this.value)"></div>' +
    '<div class="field"><textarea class="fta" placeholder="Comment tu t\'es senti ? Ce qui etait dur, ce qui a bien marche..." oninput="patch(\'text\',this.value)">' + (e.text||'') + '</textarea></div>' +
    '<div class="prev-lbl">Sessions precedentes — ' + d.name + '</div>' + pastHTML;

  document.querySelectorAll('.state-slider').forEach(updateSliderGrad);

function chDate(d) { var n = shiftDate(dayDates[cDay],d); if (n>todayStr()) return; dayDates[cDay]=n; renderJournal(); }
function goToday() { dayDates[cDay]=todayStr(); renderJournal(); }
function patch(f,v) { var k=jk(cDay,dayDates[cDay]); if(!J[k])J[k]={}; J[k][f]=v; }
function patchState(f,v) { var k=jk(cDay,dayDates[cDay]); if(!J[k])J[k]={}; if(!J[k].state)J[k].state={energy:7,motivation:7,sleep:7}; J[k].state[f]=v; }
function setPerfVal(n,v) {
  var k=jk(cDay,dayDates[cDay]); if(!J[k])J[k]={}; if(!J[k].perfs)J[k].perfs={}; if(!J[k].perfs[n])J[k].perfs[n]={}; J[k].perfs[n].value=v;
  // re-render live calli stats
  var calliSession = computeCalliStats(J[k], cDay);
  var hasPerfs = Object.keys(J[k].perfs||{}).some(function(k) { return J[k] && J[k].value; });
  // lightweight update — just re-render the whole journal stats area? no, too disruptive.
}
function setPerfNote(n,v) { var k=jk(cDay,dayDates[cDay]); if(!J[k])J[k]={}; if(!J[k].perfs)J[k].perfs={}; if(!J[k].perfs[n])J[k].perfs[n]={}; J[k].perfs[n].note=v; }

function saveEntry() {
  var k = jk(cDay, dayDates[cDay]), e = J[k];
  if (!e) return;
  var hasData = Object.values(e).some(function(v) {
    if (!v) return false;
    if (typeof v === 'string') return v.trim().length > 0;
    if (typeof v === 'object') return Object.keys(v).length > 0;
    return true;
  });
  if (!hasData) return;
  J[k].score = computeScore(e);
  var btn = document.getElementById('saveBtn');
  if (btn) { btn.textContent='Sync...'; btn.disabled=true; }
  cloudSave(k, J[k]).then(function() {
    renderStrip();
    // refresh live calli stats
    renderJournal();
    if (btn) { btn.textContent='Sauvegarde ✓'; btn.classList.add('saved'); btn.disabled=false; setTimeout(function(){btn.textContent='Sauvegarder';btn.classList.remove('saved');},2200); }
    var o = document.getElementById('saveOverlay');
    document.getElementById('saveMsg').textContent = SAVE_MSGS[Math.floor(Math.random()*SAVE_MSGS.length)];
    document.getElementById('saveSub').textContent = SAVE_SUBS[Math.floor(Math.random()*SAVE_SUBS.length)];
    o.classList.remove('show'); void o.offsetWidth; o.classList.add('show');
    setTimeout(function(){o.classList.remove('show');}, 2600);
    vibrate();
  });
}

      // Calisthenics stats row
      (cs.totalReps||cs.totalHold ? '<div class="h-calli-row">' +
        (cs.totalReps ? '<div class="h-calli-pill"><span class="hcp-lbl">🔢</span><span class="hcp-val" style="color:var(--text)">'+cs.totalReps+'</span><span class="hcp-lbl">reps</span></div>' : '') +
        (cs.totalHold ? '<div class="h-calli-pill"><span class="hcp-lbl">⏱</span><span class="hcp-val" style="color:var(--green)">'+fmtHold(cs.totalHold)+'</span><span class="hcp-lbl">holds</span></div>' : '') +
        Object.keys(cs.byPattern).filter(function(p){return cs.byPattern[p]>0;}).slice(0,3).map(function(p){
          var pc = PATTERN_COLORS[p];
          return '<div class="h-calli-pill"><span class="hcp-val" style="color:'+pc.hex+'">'+cs.byPattern[p]+'</span><span class="hcp-lbl">'+pc.label+'</span></div>';
        }).join('') +
      '</div>' : '') +
      (perfEntries.length?'<div class="h-perf-grid">'+perfEntries.slice(0,6).map(function(pe){
        var pc2 = PATTERN_COLORS[getPattern(pe[0], getCustomPatterns(di))];
        return '<div class="h-perf-item">' +
          '<div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">' +
          '<div class="h-perf-name" style="flex:1">'+pe[0].split(' ').slice(0,3).join(' ')+'</div>' +
          '<span class="pattern-badge '+pc2.cls+'" style="font-size:7px">'+pc2.label+'</span>' +
          '</div>' +
          '<div class="h-perf-val">'+pe[1].value+'</div>'+(pe[1].note?'<div class="h-perf-note">'+pe[1].note.slice(0,30)+'</div>':'')+'</div>';
      }).join('')+'</div>':'') +
      '</div>';
  }).join('') : '<div class="empty-state" style="padding:40px 0">📭<br><br>Aucune entree pour ce filtre.</div>';

  var filterShorts = ['ALL'].concat(DAYS().map(function(d){return d.short;})).filter(function(v,i,a){return a.indexOf(v)===i;});
  view.innerHTML =
    '<div class="hist-top">' +
    '<div class="hist-title">HISTORIQUE</div>' +
    '<div class="hist-filters">' +
    filterShorts.map(function(f){
      return '<button class="hfilter '+(histFilter===f?'active':'')+'" onclick="setHistFilter(\''+f+'\')">'+f+'</button>';
    }).join('') + '</div></div>' + cardsHTML;
}

function setHistFilter(f) { histFilter=f; renderHistory(); }

// ── SPLIT EDITOR ──────────────────────────────────────────────────────────────
function openSplitEditor() {
  // Deep-copy the active split into the editor working state
  var activeSplit = getActiveSplit();
  seData = JSON.parse(JSON.stringify(activeSplit || DEFAULT_DAYS));
  seDayIdx = 0;
  document.getElementById('seOverlay').classList.add('open');
  document.getElementById('seModal').classList.add('open');
  renderSeSidebar();
  renderSeContent();
}

function closeSplitEditor() {
  document.getElementById('seOverlay').classList.remove('open');
  document.getElementById('seModal').classList.remove('open');
}

function renderSeSidebar() {
  var html = seData.map(function(d, i) {
    return '<div class="se-day-chip ' + (i===seDayIdx?'active':'') + '" onclick="seSelectDay(' + i + ')" style="border-color:' + (i===seDayIdx ? d.color : '') + '">' +
      '<div class="sdc-day">' + DNAMES[i] + '</div>' +
      '<div class="sdc-name" style="color:' + d.color + '">' + d.short + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('seSidebar').innerHTML = html;
}

function seSelectDay(i) {
  seDayIdx = i;
  renderSeSidebar();
  renderSeContent();
}

function seGet() { return seData[seDayIdx]; }

var SE_PATTERNS = ['PULL','PUSH','CORE','MOBILITY','LEGS','CARDIO'];

function renderSeContent() {
  var d = seGet();
  var isCircuit = d.type === 'circuit';

  var exList = [];
  if (isCircuit) {
    exList = (d.circuit||[]);
  } else {
    exList = (d.sections && d.sections[0] && d.sections[0].exercises) || [];
  }

  var phasePairs = [['1','S1-2'],['2','S3-4'],['3','S5-6'],['4','S7-8+']];

  var exCardsHTML = exList.map(function(ex, ei) {
    var patternBtns = SE_PATTERNS.map(function(p) {
      var pc = PATTERN_COLORS[p];
      var isActive = (ex.pattern === p);
      return '<button class="se-pattern-btn ' + (isActive ? 'active-' + p.toLowerCase() : '') + '" onclick="seSetPattern(' + ei + ',\'' + p + '\')">' + pc.label + '</button>';
    }).join('');

    var volBtns = '';
    if (isCircuit) {
      var repsObj = ex.reps || ex.vol || {};
      volBtns = '<div class="se-phases-grid">' +
        phasePairs.map(function(pp) {
          return '<div class="se-phase-box">' +
            '<div class="se-phase-lbl">' + pp[1] + '</div>' +
            '<input class="se-phase-input" placeholder="ex: 5x5" value="' + sv((repsObj[pp[0]]||'')) + '" oninput="seSetVol(' + ei + ',' + pp[0] + ',this.value)">' +
            '</div>';
        }).join('') +
        '</div>';
    } else {
      var volObj = ex.vol || {};
      volBtns = '<div class="se-phases-grid">' +
        phasePairs.map(function(pp) {
          return '<div class="se-phase-box">' +
            '<div class="se-phase-lbl">' + pp[1] + '</div>' +
            '<input class="se-phase-input" placeholder="ex: 3x10, 30s" value="' + sv((volObj[pp[0]]||'')) + '" oninput="seSetVol(' + ei + ',' + pp[0] + ',this.value)">' +
            '</div>';
        }).join('') +
        '</div>';
    }

    return '<div class="se-ex-card" id="se-ex-' + ei + '">' +
      '<div class="se-ex-header">' +
      '<div class="se-ex-num">' + (ei+1) + '</div>' +
      '<input class="se-ex-name-input" placeholder="Nom de l\'exercice" value="' + sv(ex.name||'') + '" oninput="seSetExName(' + ei + ',this.value)">' +
      '<button class="se-del-btn" onclick="seDelEx(' + ei + ')">✕</button>' +
      '</div>' +
      '<input class="se-ex-note-input" placeholder="Description / note..." value="' + sv(ex.note||'') + '" oninput="seSetExNote(' + ei + ',this.value)">' +
      '<div class="se-section-title" style="margin-top:6px;margin-bottom:6px;font-size:9px">PATTERN</div>' +
      '<div class="se-pattern-row" style="margin-bottom:10px">' + patternBtns + '</div>' +
      '<div class="se-section-title" style="margin-top:0;margin-bottom:6px;font-size:9px">VOLUMES PAR PHASE</div>' +
      volBtns +
      '</div>';
  }).join('');

  var toursBtns = isCircuit ? '<div class="se-field">' +
    '<div class="se-label">TOURS PAR PHASE</div>' +
    '<div class="se-tours-grid">' +
    phasePairs.map(function(pp) {
      var tv = (d.tours && d.tours[pp[0]]) || '';
      return '<div class="se-phase-box">' +
        '<div class="se-phase-lbl">' + pp[1] + '</div>' +
        '<input class="se-phase-input" placeholder="ex: 3 tours" value="' + sv(tv) + '" oninput="seSetTours(' + pp[0] + ',this.value)">' +
        '</div>';
    }).join('') +
    '</div></div>' : '';

  document.getElementById('seContent').innerHTML =
    '<div class="se-info-pill">✏️ Modifications sauvegardées dans le cloud + localement</div>' +

    '<div class="se-field">' +
    '<div class="se-label">NOM COMPLET</div>' +
    '<input class="se-input" placeholder="ex: FORCE" value="' + sv(d.name||'') + '" oninput="seSetField(\'name\',this.value)">' +
    '</div>' +

    '<div class="se-field">' +
    '<div class="se-label">ABREVIATION (affiché dans le strip)</div>' +
    '<input class="se-input" placeholder="ex: FORCE" value="' + sv(d.short||'') + '" oninput="seSetField(\'short\',this.value)">' +
    '</div>' +

    '<div class="se-field">' +
    '<div class="se-label">LABEL (affiché sous le nom)</div>' +
    '<input class="se-input" placeholder="ex: Lundi — Force Lourde + Tractions" value="' + sv(d.label||'') + '" oninput="seSetField(\'label\',this.value)">' +
    '</div>' +

    '<div class="se-field">' +
    '<div class="se-label">OBJECTIF DU JOUR</div>' +
    '<textarea class="se-textarea" placeholder="Description courte de l\'objectif..." oninput="seSetField(\'obj\',this.value)">' + (d.obj||'') + '</textarea>' +
    '</div>' +

    '<div class="se-field">' +
    '<div class="se-label">TYPE</div>' +
    '<div class="se-type-row">' +
    ['standard','circuit','rest'].map(function(t) {
      return '<button class="se-type-btn ' + (d.type===t?'active':'') + '" onclick="seSetType(\'' + t + '\')">' + t.toUpperCase() + '</button>';
    }).join('') +
    '</div>' +
    '</div>' +

    '<div class="se-field">' +
    '<div class="se-label">COULEUR (hex)</div>' +
    '<input class="se-input" placeholder="#5BA4F5" value="' + sv(d.color||'') + '" oninput="seSetColorField(this.value)">' +
    '</div>' +

    toursBtns +

    '<div class="se-section-title">EXERCICES</div>' +

    exCardsHTML +

    '<div class="se-add-ex" onclick="seAddEx()">＋ AJOUTER UN EXERCICE</div>' +

    '<div class="se-section-title">CONSEIL / TIP</div>' +
    '<div class="se-field">' +
    '<textarea class="se-tip-input" placeholder="Conseil affiché en bas de séance..." oninput="seSetField(\'tip\',this.value)">' + (d.tip||'') + '</textarea>' +
    '</div>';
}

// SE mutations
function seSetField(f, v) { seData[seDayIdx][f] = v; }

function seSetColorField(v) {
  seData[seDayIdx].color = v;
  seData[seDayIdx].col = v;
  seData[seDayIdx].bg = v.replace('#','rgba(') + ',0.12)';
  renderSeSidebar();
}

function seSetType(t) {
  seData[seDayIdx].type = t;
  if (t === 'circuit' && !seData[seDayIdx].circuit) {
    seData[seDayIdx].circuit = [];
    seData[seDayIdx].tours = {1:'2 tours',2:'3 tours',3:'3 tours',4:'4 tours'};
  }
  if (t !== 'circuit' && !seData[seDayIdx].sections) {
    seData[seDayIdx].sections = [{title:'EXERCICES', exercises:[]}];
  }
  renderSeContent();
}

function seSetTours(phase, v) {
  if (!seData[seDayIdx].tours) seData[seDayIdx].tours = {};
  seData[seDayIdx].tours[phase] = v;
}

function seGetExList() {
  var d = seData[seDayIdx];
  if (d.type === 'circuit') return d.circuit = d.circuit || [];
  if (!d.sections) d.sections = [{title:'EXERCICES', exercises:[]}];
  if (!d.sections[0].exercises) d.sections[0].exercises = [];
  return d.sections[0].exercises;
}

function seSetExName(ei, v) { seGetExList()[ei].name = v; }
function seSetExNote(ei, v) { seGetExList()[ei].note = v; }

function seSetPattern(ei, p) {
  seGetExList()[ei].pattern = p;
  renderSeContent();
}

function seSetVol(ei, phase, v) {
  var ex = seGetExList()[ei];
  var d = seData[seDayIdx];
  if (d.type === 'circuit') {
    if (!ex.reps) ex.reps = {};
    ex.reps[phase] = v;
    ex.vol = ex.reps;
  } else {
    if (!ex.vol) ex.vol = {};
    ex.vol[phase] = v;
  }
}

function seAddEx() {
  var d = seData[seDayIdx];
  var isCircuit = d.type === 'circuit';
  var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var list = seGetExList();
  var newEx = {
    name: '',
    note: '',
    pattern: 'PUSH',
    vol: {1:'', 2:'', 3:'', 4:''},
  };
  if (isCircuit) {
    newEx.letter = letters[list.length] || String(list.length+1);
    newEx.reps = {1:'', 2:'', 3:'', 4:''};
  }
  list.push(newEx);
  renderSeContent();
  // scroll to bottom of content
  setTimeout(function() {
    var sc = document.getElementById('seContent');
    if (sc) sc.scrollTop = sc.scrollHeight;
  }, 100);
}

function seDelEx(ei) {
  var list = seGetExList();
  list.splice(ei, 1);
  renderSeContent();
}

function saveSplit() {
  // Validate: ensure colors are hex or rgba
  seData.forEach(function(d) {
    if (!d.bg || d.bg.length < 3) {
      var hex = d.color || '#888888';
      d.bg = hex + '1f'; // ~12% opacity hex
      d.col = d.color || '#888888';
    }
  });

  J['__split__'] = seData;
  var saveBtn = document.querySelector('.se-save');
  if (saveBtn) { saveBtn.textContent = 'Sync...'; saveBtn.disabled = true; }

  cloudSave('__split__', seData).then(function() {
    if (saveBtn) { saveBtn.textContent = '✓ Sauvegardé'; saveBtn.disabled = false; }
    closeSplitEditor();
    renderStrip();
    renderWorkout();
    renderJournal();
    if (cView === 'home') renderHome();
    if (cView === 'history') renderHistory();
    setTimeout(function() {
      if (saveBtn) saveBtn.textContent = 'SAUVEGARDER';
    }, 1500);
  }).catch(function() {
    if (saveBtn) { saveBtn.textContent = 'SAUVEGARDER'; saveBtn.disabled = false; }
  });
}

// ── MUSIC ─────────────────────────────────────────────────────────────────────
function loadMp3File(input) {
  var file = input.files[0]; if (!file) return;
  TRACKS[0].blobUrl = URL.createObjectURL(file);
  TRACKS[0].name = file.name.replace(/\.mp3$/i,'').slice(0,30);
  if (mpTrack===0 && mpAudio) { mpAudio.pause(); mpAudio=null; mpPlaying=false; }
  buildMusicPanel(); updateMusicUI();
}

function buildMusicPanel() {
  var list = document.getElementById('mpTrackList'); if (!list) return;
  list.innerHTML = TRACKS.map(function(t,i) {
    return '<div class="mp-track '+(mpTrack===i?'active':'')+'" onclick="mpSelect('+i+')">' +
      '<div class="mp-track-ico">'+t.icon+'</div>' +
      '<div class="mp-track-info"><div class="mp-track-tname">'+t.name+'</div><div class="mp-track-meta">'+t.sub+'</div></div>' +
      '</div>';
  }).join('');
}

function toggleMusicPanel() {
  var p=document.getElementById('musicPanel'), o=document.getElementById('musicOverlay');
  if (p.classList.contains('open')) { closeMusicPanel(); }
  else { p.classList.add('open'); o.style.display='block'; buildMusicPanel(); }
}
function closeMusicPanel() { document.getElementById('musicPanel').classList.remove('open'); document.getElementById('musicOverlay').style.display='none'; }

function mpSelect(i) {
  mpTrack=i; if (mpAudio){mpAudio.pause();mpAudio=null;}
  mpAudio=new Audio(TRACKS[i].blobUrl||TRACKS[i].file); mpAudio.volume=mpVol; mpAudio.loop=true;
  mpAudio.play().then(function(){mpPlaying=true;updateMusicUI();}).catch(function(){mpPlaying=false;updateMusicUI();});
  updateMusicUI();
}
function mpToggle() { if(!mpAudio){if(TRACKS.length)mpSelect(0);return;} if(mpPlaying){mpAudio.pause();mpPlaying=false;}else{mpAudio.play().catch(function(){});mpPlaying=true;} updateMusicUI(); }
function mpNext() { mpSelect(mpTrack===null?0:(mpTrack+1)%TRACKS.length); }
function mpPrev() { mpSelect(mpTrack===null?0:(mpTrack-1+TRACKS.length)%TRACKS.length); }
function mpSetVol(v) { mpVol=v; if(mpAudio)mpAudio.volume=v; }

function updateMusicUI() {
  var t = mpTrack!==null ? TRACKS[mpTrack] : null;
  document.getElementById('mpNowName').textContent = t?t.name:'—';
  document.getElementById('mpNowSub').textContent = t?t.sub:'Selectionnne une piste';
  var pb = document.getElementById('mpPlayBtn'); if(pb) pb.textContent=mpPlaying?'⏸':'▶';
  var wave = document.getElementById('mpWave');
  if (wave) { wave.className = 'wave-bars'+(mpPlaying?' playing':''); if(!mpPlaying) wave.innerHTML='<div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div>'; }
  var mb = document.getElementById('musicBtn'); if(mb) mb.classList.toggle('playing',mpPlaying);
  buildMusicPanel();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadAll().then(function() {
  setMobile('home');
  renderStrip();
  renderWorkout();
  renderJournal();
  mpTrack = 0;
  updateMusicUI();
}).catch(function() {
  setMobile('home');
  renderStrip();
  renderWorkout();
  renderJournal();
});

window.addEventListener('resize', function() {
  if (window.innerWidth > 680) {
    document.getElementById('workoutPane').classList.add('active');
    document.getElementById('journalPane').classList.add('active');
  } else {
    document.getElementById('workoutPane').classList.toggle('active', mPane==='workout');
    document.getElementById('journalPane').classList.toggle('active', mPane==='journal');
  }
});
</script>
